<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00468E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="MonInv">
<title>MonInv</title>
<link rel="icon" href="assets/favicon.svg?v=0.7.8" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png?v=0.7.8" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=0.7.8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="css/app.css?v=0.7.8">
<link rel="stylesheet" href="css/mobile.css?v=0.7.8">
</head>
<body>
<header class="top">
  <a class="brand" href="#karte" data-view="karte" aria-label="MonInv – zur Karte">
    <span class="b-name">MonInv</span>
    <span class="b-sub">MONITORING-INVENTAR</span>
  </a>
  <nav class="nav" aria-label="Bereiche">
    <a href="#karte" data-view="karte">Karte</a>
    <a href="#inventar" data-view="inventar">Inventar</a>
    <a href="#tachymeter" data-view="tachymeter">Tachymeter &amp; MCC</a>
    <a href="#projekte" data-view="projekte">Projekte</a>
    <a href="#einstellungen" data-view="einstellungen">Einstellungen</a>
  </nav>
  <span class="grow"></span>
  <div class="search">
    <label for="q" class="sr">Gerät suchen</label>
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></svg>
    <input id="q" type="search" placeholder="Gerät, Seriennummer, SIM …" autocomplete="off">
    <div id="search-res" class="search-res" hidden></div>
  </div>
  <button type="button" class="scan-btn" data-act="scan" aria-label="QR-Etikett scannen" title="QR-Etikett scannen"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="3" height="3"/><rect x="13" y="8" width="3" height="3"/><rect x="8" y="13" width="3" height="3"/><path d="M13 13h3v3"/></svg><span>Scannen</span></button>
  <span class="ver" id="ver" title="Version">v0.7.0</span>
  <span class="src" id="src" title="Datenquelle"></span>
  <img class="top-logo" src="assets/logo-ristag.svg" alt="RISTAG Ingenieure AG" width="104" height="38">
</header>

<div id="banner" class="banner" hidden></div>

<main>
  <section id="v-karte" class="view v-karte">
    <aside id="map-side" class="side" aria-label="Filter"></aside>
    <div class="side-bg" data-act="side-close"></div>
    <div class="map-wrap">
      <div id="map" aria-label="Karte aller Geräte"></div>
      <div id="map-tools" class="map-tools"></div>
      <div id="placing-bar" class="placing" hidden></div>
      <div id="map-coord" class="map-coord" aria-hidden="true"></div>
    </div>
    <aside id="panel" class="panel" aria-label="Details"></aside>
  </section>
  <section id="v-inventar" class="view" hidden></section>
  <section id="v-tachymeter" class="view" hidden></section>
  <section id="v-projekte" class="view" hidden></section>
  <section id="v-einstellungen" class="view" hidden></section>
</main>

<nav class="tabbar" aria-label="Bereiche">
  <a href="#karte" data-view="karte"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M1 5l7-2 8 2 7-2v16l-7 2-8-2-7 2z"/><path d="M8 3v16M16 5v16"/></svg>Karte</a>
  <a href="#inventar" data-view="inventar"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2.8l8.2 4.4v9.6L12 21.2l-8.2-4.4V7.2z"/><path d="M3.8 7.2L12 11.6l8.2-4.4M12 11.6v9.6"/><path d="M7.9 5l8.2 4.4v3.3"/></svg>Inventar</a>
  <a href="#tachymeter" data-view="tachymeter"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="7.5" y="2.8" width="9" height="8.4" rx="2"/><circle cx="12" cy="7" r="2"/><path d="M9.5 13.6h5M12 13.6L6 21.5M12 13.6l6 7.9M12 13.6v7.9"/><path d="M18.8 4.6a3.8 3.8 0 0 1 0 4.8" class="t-acc"/></svg>Tachymeter</a>
  <a href="#projekte" data-view="projekte"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 10h16"/></svg>Projekte</a>
  <a href="#einstellungen" data-view="einstellungen"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><circle cx="17" cy="17" r="3.6" class="t-acc"/></svg>Mehr</a>
</nav>

<div id="drawer" hidden></div>
<div id="modal-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="loading" class="loading"><div class="ld"><span class="ld-tri"></span>MonInv wird geladen …</div></div>

<!-- config.js immer frisch laden: Änderungen an der Datenquelle gelten sofort, ohne Versionswechsel -->
<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');</script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.js"></script>
<script src="vendor/msal/msal-browser.min.js"></script>
<script src="js/symbols.js?v=0.7.8"></script>
<script src="js/beispiel.js?v=0.7.8"></script>
<script src="js/store.js?v=0.7.8"></script>
<script src="js/core.js?v=0.7.8"></script>
<script src="js/map.js?v=0.7.8"></script>
<script src="js/views.js?v=0.7.8"></script>
<script src="js/forms.js?v=0.7.8"></script>
<script src="js/import.js?v=0.7.8"></script>
<script src="js/app.js?v=0.7.8"></script>
<script src="js/labels.js?v=0.7.8"></script>
<script src="js/pdf.js?v=0.7.8"></script>
<script src="js/auslastung.js?v=0.7.8"></script>
<script src="js/mobile.js?v=0.7.8"></script>
<script src="js/motion.js?v=0.7.8"></script>
</body>
</html>
